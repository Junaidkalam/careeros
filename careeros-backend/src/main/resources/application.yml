spring:
  application:
    name: careeros-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/careeros
    username: careeros
    password: careeros
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-prod-to-a-long-random-string}
    expiration-ms: 86400000

  ai:
    provider-api-key: ${AI_PROVIDER_API_KEY:}

  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}

  storage:
    local-path: ./uploads